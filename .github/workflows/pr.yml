name: PR

# Pull-request pipeline. Production lives on `main` and is built + deployed by
# Cloudflare Workers Builds; this workflow runs on pull requests ONLY and never
# touches main.
#
#   checks         - typecheck (app + worker), lint, translation parity, build
#   deploy-preview - deploy the PR's code to the shared prism-preview Worker,
#                    gated behind checks passing
#
# Security model — why this cannot leak CLOUDFLARE_API_TOKEN to a hostile PR:
#   * This uses `pull_request`, NOT `pull_request_target`. GitHub withholds all
#     repository secrets from fork-triggered pull_request runs, so the token is
#     absent from the environment even if the PR edits this file. (Never switch
#     this to pull_request_target with a checkout of the PR head.)
#   * The deploy job additionally runs only for same-repo branches (the `if`
#     below); forks get the checks job, which references no secrets.
#   * The token is set on the deploy job only, never on checks, and no untrusted
#     PR text is interpolated into run: scripts.
# For same-repo PRs (write-access authors) the deploy runs their build with the
# token, so the deploy job targets a `preview` Environment — add required
# reviewers there, and/or store the token as an environment secret, to gate it.
#
# Requires CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, D1:Edit, Workers KV
# Storage:Edit, Secrets Store:Read); the account id is pinned in wrangler.jsonc.

on:
  pull_request:

# A newer commit on the same PR supersedes the older run.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Least privilege by default; the deploy job widens its own scope below.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck (app)
        run: bunx tsc -p tsconfig.app.json --noEmit
      - name: Typecheck (worker)
        run: bunx tsc -p tsconfig.worker.json --noEmit
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Translation parity
        run: bash scripts/check_translations.sh
      - name: Build
        run: bunx vite build

  deploy-preview:
    needs: checks
    # Secrets are unavailable to forked pull_request runs, so the deploy can
    # only work for same-repo branches. Skip it (cleanly) for forks. (A comment
    # `<!try_redeploy!>` can force a redeploy past failing checks — see
    # preview-comment.yml.)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Gate point: configure required reviewers / an environment-scoped secret on
    # the `preview` Environment to control deploys from same-repo PRs.
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    # The preview Worker is shared across PRs: one deploy at a time, newest wins.
    concurrency:
      group: deploy-preview
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Cache Cargo + WASM build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pow/target
          key: cargo-${{ runner.os }}-${{ hashFiles('pow/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build PoW WASM
        run: |
          cargo build --release --target wasm32-unknown-unknown --manifest-path pow/Cargo.toml
          cp pow/target/wasm32-unknown-unknown/release/prism_pow.wasm public/pow.wasm
      - name: Apply D1 migrations (preview)
        run: bun run db:migrate:preview
      - name: Deploy preview
        run: bun run deploy:preview
      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --edit-last --create-if-none \
            --body "Preview deployed: https://prism-preview.siiway.workers.dev (shared preview Worker + database, so the newest PR deploy is what is live there)."
