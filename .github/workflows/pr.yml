name: PR

# Pull-request checks: typecheck (app + worker), lint, tests, translation
# parity, and a build. Nothing is deployed from a pull request, and this
# workflow references no secrets, so fork PRs run it the same as branch PRs.
# Production is deployed by deploy.yml on push to main.
#
# Keep this on `pull_request`, never `pull_request_target`: the latter runs with
# repository secrets, which PR code must never see.

on:
  pull_request:

# A newer commit on the same PR supersedes the older run.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck (app)
        run: bunx tsc -p tsconfig.app.json --noEmit
      - name: Typecheck (worker)
        run: bunx tsc -p tsconfig.worker.json --noEmit
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Translation parity
        run: bun run check:i18n
      - name: Build
        run: bunx vite build
