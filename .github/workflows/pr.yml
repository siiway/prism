name: PR

# Pull-request checks: the prek hooks from app/prek.toml, both the pre-commit and
# pre-push stages over every file, then a build and a check that NOTICE.md
# matches it. Nothing is deployed from a pull request, and this
# workflow references no secrets, so fork PRs run it the same as branch PRs.
# Production is deployed by deploy.yml on push to main.
#
# Keep this on `pull_request`, never `pull_request_target`: the latter runs with
# repository secrets, which PR code must never see.

on:
  pull_request:

# A newer commit on the same PR supersedes the older run.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Cache Bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Commit hooks (prettier, eslint, file checks)
        run: bunx prek run -c prek.toml --all-files --show-diff-on-failure --color=always
      - name: Push hooks (typecheck, tests, translations, build and NOTICE.md)
        run: bunx prek run -c prek.toml --all-files --hook-stage pre-push --color=always
