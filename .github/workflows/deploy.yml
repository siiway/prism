name: Deploy

# Shared deploy job, called by every workflow that ships a Worker:
#
#   deploy-prod.yml      push to main             -> production
#   deploy-nonprod.yml   push to staging / manual -> staging or preview
#   pr.yml               pull request             -> preview
#   preview-comment.yml  `<!try_redeploy!>`       -> preview
#
# Callers own the trigger and any trust gating; this file owns how a deploy
# runs. Callers pass `secrets: inherit` so CLOUDFLARE_API_TOKEN resolves here,
# where the job's Environment is known (an environment-scoped secret wins over
# the repository one).
#
# Production goes through scripts/build.sh + scripts/deploy.sh, the same path as
# a local deploy: build, apply pending D1 migrations, publish. Non-production
# goes through the db:migrate:<env> + deploy:<env> scripts (deploy-env.mjs),
# which select the environment at build time.
#
# CLOUDFLARE_API_TOKEN needs, on the SiiWay account: Workers Scripts:Edit,
# D1:Edit, Workers KV Storage:Edit, Secrets Store:Read; plus Workers Routes:Edit
# and Zone:Read on the zone for production, which is on a custom domain. The
# account id is pinned in wrangler.jsonc.

on:
  workflow_call:
    inputs:
      environment:
        description: production, staging, or preview
        type: string
        required: true
      ref:
        description: Git ref to check out (defaults to the triggering ref)
        type: string
        default: ""
      checks:
        description: Run lint, tests and translation parity before deploying
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Gate point: add required reviewers or an environment-scoped token to the
    # matching GitHub Environment (production / staging / preview).
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment == 'production' && 'https://prism.siiway.org' || format('https://prism-{0}.siiway.workers.dev', inputs.environment) }}
    # One deploy per Worker at a time. Non-production: newest wins. Production
    # is never cancelled mid-run (it may be between migrating and publishing);
    # a newer run waits for the current one instead.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: ${{ inputs.environment != 'production' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TARGET_ENV: ${{ inputs.environment }}
    steps:
      - name: Validate environment
        run: |
          case "$TARGET_ENV" in
            production|staging|preview) ;;
            *) echo "unknown environment: $TARGET_ENV" >&2; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup Rust (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache Cargo + WASM build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pow/target
          key: cargo-${{ runner.os }}-${{ hashFiles('pow/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        if: inputs.checks
        run: bun run lint

      - name: Test
        if: inputs.checks
        run: bun run test

      - name: Translation parity
        if: inputs.checks
        run: bash scripts/check_translations.sh

      - name: Build PoW WASM
        run: |
          cargo build --release --target wasm32-unknown-unknown --manifest-path pow/Cargo.toml
          cp pow/target/wasm32-unknown-unknown/release/prism_pow.wasm public/pow.wasm

      # ── Production ──────────────────────────────────────────────────────────
      - name: Build (production)
        if: inputs.environment == 'production'
        run: bash scripts/build.sh --skip-wasm

      - name: Apply D1 migrations and deploy (production)
        if: inputs.environment == 'production'
        run: bash scripts/deploy.sh --skip-build --yes

      # ── Non-production ──────────────────────────────────────────────────────
      - name: Apply D1 migrations (${{ inputs.environment }})
        if: inputs.environment != 'production'
        run: bun run "db:migrate:$TARGET_ENV"

      - name: Build and deploy (${{ inputs.environment }})
        if: inputs.environment != 'production'
        run: bun run "deploy:$TARGET_ENV"
