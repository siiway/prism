name: Deploy

# Builds and deploys the production `prism` Worker. This replaces the Cloudflare
# Workers Builds integration -- disconnect the repository under the Worker's
# Settings -> Builds in the dashboard, or every push to main deploys twice.
#
# Triggers:
#   * push to `main`                 -> deploy production
#   * manual run (workflow_dispatch) -> redeploy production from main
#
# The run uses the same scripts as a local deploy: scripts/build.sh (install,
# typecheck, Vite build, deploy-ready wrangler.json), then scripts/deploy.sh,
# which applies pending D1 migrations before publishing. The prek hooks from
# prek.toml (file checks, prettier, eslint, typechecks, tests, translations)
# run first, so a failure stops the deploy before anything reaches production.
#
# Requires CLOUDFLARE_API_TOKEN (repository or `production` Environment secret)
# scoped to the SiiWay account with: Workers Scripts:Edit, D1:Edit, Workers KV
# Storage:Edit, Secrets Store:Read, plus Workers Routes:Edit and Zone:Read on
# the zone, because production is attached to a custom domain. The account id
# is pinned in wrangler.jsonc.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a deploy mid-run (it may be between migrating and publishing).
# A newer run waits for the current one instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # A manual run started from another branch must not ship that branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Gate point: add required reviewers or an environment-scoped token to the
    # `production` Environment to control deploys.
    environment:
      name: production
      url: https://prism.siiway.org
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup Rust (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache Cargo + WASM build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/pow/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src/pow/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install prek
        uses: j178/prek-action@v3.0.1
        with:
          prek-version: 0.5.7
          install-only: true
          cache: false

      - name: Commit hooks (prettier, eslint, file checks)
        run: prek run --all-files --show-diff-on-failure --color=always

      - name: Push hooks (typecheck, tests, translations)
        run: prek run --all-files --hook-stage pre-push --color=always

      - name: Build PoW WASM
        run: |
          cargo build --release --target wasm32-unknown-unknown --manifest-path src/pow/Cargo.toml
          cp src/pow/target/wasm32-unknown-unknown/release/prism_pow.wasm public/pow.wasm

      - name: Build
        run: bash scripts/build.sh --skip-wasm

      - name: Apply D1 migrations and deploy
        run: bash scripts/deploy.sh --skip-build --yes
