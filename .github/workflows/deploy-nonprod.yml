name: Deploy non-production

# Deploys the non-production Workers (prism-staging / prism-preview) through the
# shared deploy.yml. Production is deploy-prod.yml; this never touches it.
#
# Triggers:
#   * push to the `staging` branch   -> deploy the staging Worker
#   * manual run (workflow_dispatch) -> deploy the chosen environment
#
# The preview Worker is driven by pull requests (see pr.yml), so it is not on
# the push list here; workflow_dispatch can still deploy it manually.

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      environment:
        description: Non-production environment to deploy
        type: choice
        options:
          - staging
          - preview
        required: true

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ github.event.inputs.environment || 'staging' }}
    secrets: inherit
